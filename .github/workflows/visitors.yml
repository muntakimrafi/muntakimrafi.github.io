name: Refresh visitor map

# GitHub Pages serves files and keeps no log the site can read, so the counting
# happens at GoatCounter and lands here once a day as data/visitors.json.
# Needs two repository secrets: GOATCOUNTER_CODE and GOATCOUNTER_TOKEN.

on:
  schedule:
    - cron: "17 4 * * *"        # 04:17 UTC daily, off the hour so it is not queued behind everyone else
  workflow_dispatch:            # and on demand, from the Actions tab

permissions:
  contents: write

concurrency:
  group: visitors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch country totals
        env:
          GOATCOUNTER_CODE: ${{ secrets.GOATCOUNTER_CODE }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 tools/fetch_visitors.py

      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- data/visitors.json; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visitors.json
          git commit -m "Refresh visitor counts"
          git push
